<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Us ❤️</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to bottom right, #ff9a9e, #fad0c4);
            color: #333;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
            font-size: 2.2rem;
        }

        p {
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .gallery img {
            width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        footer {
            margin: 20px 0;
            font-size: 0.9rem;
        }
    </style>
</head>





<body>
<audio id="bg-music" loop>
    <source src="Mariah_Carey_Ft._Luther_Vandross_-_Endless_Love_(mp3.pm).mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>


    <h1>Me & My Love ❤️</h1>
    <h1>❤️MTSHepoNICA❤️</h1>
<button onclick="playMusic()" style="
    padding: 12px 20px;
    font-size: 16px;
    border-radius: 25px;
    border: none;
    background: #ff4d6d;
    color: white;
    cursor: pointer;
">
    ▶ Play Our Song Babe!
</button>

    <p>Our memories, our moments</p>

    <div class="gallery">
        <img src="photo1.jpg" alt="Us together">
        <img src="photo2.jpg" alt="Date night">
        <img src="photo3.jpg" alt="Memories">
        <img src="photo4.jpg" alt="Love">
        <img src="photo5.jpg" alt="Love">
        <img src="photo6.jpg" alt="Love">
    </div>

    <footer>
        Made with ❤️ by me
    </footer>

</body>

<script>
function playMusic() {
    const music = document.getElementById("bg-music");
    music.play();
}
</script>


</html>
